<body class="auth-body">
    <main class="auth">
        <div class="auth-card">
            <a class="logo" href="index.html"><img src="icon.svg" alt="" width="32" height="32">pixie</a>
            <h1>Forgot your password?</h1>
            <!-- skapi.forgotPassword() emails a 6 digit code to the account's (verified) email address. -->
            <p>We will email you a 6 digit code to set a new one.</p>
            <form onsubmit="requestPasswordReset(event)">
                <label>
                    Email address
                    <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
                </label>
                <button type="submit" class="btn primary wide">Send code</button>
            </form>
            <p class="auth-links"><a href="login.html">Back to login</a></p>
        </div>
    </main>

    <script>
        async function requestPasswordReset(event) {
            event.preventDefault();
            let form = event.target;
            try {
                await skapi.forgotPassword(event);
                // The email address goes to the next page in the URL hash, so it does not have to be typed again.
                location.href = pageUrl("reset-password.html#" + encodeURIComponent(form.elements.email.value));
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
