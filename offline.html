<!-- Shown by the service worker when a page is opened without a connection and is not cached yet. -->
<body class="auth-body">
    <main class="auth">
        <div class="auth-card">
            <a class="logo" href="index.html"><img src="icon.svg" alt="" width="32" height="32">pixie</a>
            <div class="auth-hero" aria-hidden="true"><img src="icon.svg" alt=""></div>
            <div class="palette-strip" aria-hidden="true"></div>
            <h1>You're offline</h1>
            <p>pixie needs a connection to load and share pixel art. It will pick up again as soon as you're back online.</p>
            <button type="button" class="btn primary wide" onclick="location.reload()">Try again</button>
        </div>
    </main>
    <script>
        window.addEventListener("online", () => location.reload());
    </script>
</body>
